<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Community Service Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffd6e8 0%, #e0c3fc 50%, #c4b5fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }

        body::before {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #ffd6e8, #e0c3fc);
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #c4b5fd, #e0c3fc);
            bottom: -50px;
            right: -50px;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            max-width: 950px;
            width: 100%;
            animation: slideIn 0.6s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #ffd6e8 0%, #e0c3fc 100%);
            padding: 60px 40px;
            color: #5a3e6e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .decorative-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
        }

        .circle-1 {
            width: 150px;
            height: 150px;
            top: 20px;
            right: 20px;
            animation: pulse 4s ease-in-out infinite;
        }

        .circle-2 {
            width: 100px;
            height: 100px;
            bottom: 40px;
            left: 30px;
            animation: pulse 3s ease-in-out infinite;
            animation-delay: 1s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.1); opacity: 0.3; }
        }

        .logo {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-right {
            flex: 1;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #ffffff;
        }

        .login-right h2 {
            color: #5a3e6e;
            margin-bottom: 10px;
            font-size: 2em;
            font-weight: 700;
        }

        .subtitle {
            color: #9d8baf;
            margin-bottom: 35px;
            font-size: 0.95em;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            color: #7a6893;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3em;
        }

        .input-group input {
            width: 100%;
            padding: 16px 18px 16px 55px;
            border: 2px solid #f0e6f6;
            border-radius: 15px;
            font-size: 1em;
            transition: all 0.3s;
            background: #faf8fc;
        }

        .input-group input:focus {
            outline: none;
            border-color: #e0c3fc;
            box-shadow: 0 0 0 4px rgba(224, 195, 252, 0.15);
            background: #ffffff;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ffd6e8 0%, #e0c3fc 50%, #c4b5fd 100%);
            color: #5a3e6e;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .signup-link {
            text-align: center;
            color: #9d8baf;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="decorative-circle circle-1"></div>
            <div class="decorative-circle circle-2"></div>

            <div class="logo">🤝</div>
            <h1>Community Service Portal</h1>
            <p>Join a vibrant community of changemakers. Discover meaningful opportunities and create lasting impact together! ✨</p>
        </div>

        <div class="login-right">
            <h2>Welcome Back! 👋</h2>
            <p class="subtitle">Please login to your account</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address 📧</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password 🔐</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot Password? 🔓</a>
                </div>

                <button type="submit" class="login-btn">Sign In ✨</button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="#">Sign up now 🚀</a>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Extract name from email (before @)
            const userName = email.split('@')[0];
            const fullName = userName.charAt(0).toUpperCase() + userName.slice(1);
            
            // Store login info in localStorage
            localStorage.setItem('userEmail', email);
            localStorage.setItem('isLoggedIn', 'true');
            
            // ✅ SAVE USER DATA FOR CERTIFICATE
            const userData = {
                name: fullName,                    // Full name from email
                username: userName,                // Username from email
                role: "Volunteer",                 // Default role
                certNumber: "CSP-2024-001",        // Certificate number
                volunteerHours: "128",             // Hours contributed
                issueDate: new Date().toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                })
            };
            
            // Save to sessionStorage for certificate page
            sessionStorage.setItem('currentUser', JSON.stringify(userData));
            
            // Redirect to dashboard
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
