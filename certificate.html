<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates - Community Service Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffd6e8 0%, #e0c3fc 50%, #c4b5fd 100%);
            min-height: 100vh;
            padding: 25px;
        }

        .container-custom {
            max-width: 1200px;
            margin: 0 auto;
        }

        .back-btn {
            background: white;
            border: none;
            padding: 12px 24px;
            border-radius: 15px;
            color: #5a3e6e;
            font-weight: 600;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(224, 195, 252, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-3px);
        }

        .page-header {
            background: white;
            padding: 35px;
            border-radius: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(224, 195, 252, 0.3);
            text-align: center;
        }

        .page-header h1 {
            color: #5a3e6e;
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #9d8baf;
            font-size: 1.1em;
        }

        /* Certificate Cards Grid */
        .certificates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .certificate-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(224, 195, 252, 0.25);
            transition: all 0.3s;
            cursor: pointer;
        }

        .certificate-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(224, 195, 252, 0.35);
        }

        .certificate-preview {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #fef9ff, #f0e6f6);
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            border: 3px solid #e0c3fc;
        }

        .certificate-info h3 {
            color: #5a3e6e;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .certificate-meta {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .meta-badge {
            background: rgba(224, 195, 252, 0.2);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.85em;
            color: #7a6893;
            font-weight: 600;
        }

        .certificate-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-view, .btn-download {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-view {
            background: linear-gradient(135deg, #c4b5fd, #e0c3fc);
            color: white;
        }

        .btn-download {
            background: linear-gradient(135deg, #ffd6e8, #fecfef);
            color: #5a3e6e;
        }

        /* Certificate Display in Modal */
        .certificate-display {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 60px;
            border: 20px solid;
            border-image: linear-gradient(135deg, #ffd6e8, #e0c3fc, #c4b5fd) 1;
            position: relative;
        }

        .certificate-ornament {
            position: absolute;
            font-size: 4em;
            opacity: 0.1;
        }

        .certificate-ornament.top-left { top: 20px; left: 20px; }
        .certificate-ornament.top-right { top: 20px; right: 20px; }
        .certificate-ornament.bottom-left { bottom: 20px; left: 20px; }
        .certificate-ornament.bottom-right { bottom: 20px; right: 20px; }

        .certificate-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .certificate-logo {
            font-size: 5em;
            margin-bottom: 15px;
        }

        .certificate-title {
            font-size: 3em;
            font-weight: 700;
            color: #5a3e6e;
            margin-bottom: 10px;
            font-family: 'Georgia', serif;
        }

        .certificate-subtitle {
            font-size: 1.2em;
            color: #9d8baf;
            font-style: italic;
        }

        .certificate-body {
            text-align: center;
            margin: 40px 0;
        }

        .certificate-text {
            font-size: 1.1em;
            color: #7a6893;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .recipient-name {
            font-size: 2.5em;
            font-weight: 700;
            color: #5a3e6e;
            margin: 25px 0;
            font-family: 'Georgia', serif;
            border-bottom: 3px solid #e0c3fc;
            display: inline-block;
            padding-bottom: 10px;
        }

        .certificate-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .detail-item {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #fef9ff, #faf8fc);
            border-radius: 12px;
        }

        .detail-label {
            font-size: 0.9em;
            color: #9d8baf;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .detail-value {
            font-size: 1.1em;
            color: #5a3e6e;
            font-weight: 700;
        }

        /* Signature Section */
        .signature-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 2px solid #e0c3fc;
        }

        .signature-block {
            text-align: center;
        }

        .signature-image {
            height: 60px;
            margin-bottom: 10px;
            font-family: 'Brush Script MT', cursive;
            font-size: 2em;
            color: #5a3e6e;
            font-weight: bold;
        }

        .signature-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c4b5fd, transparent);
            margin: 10px 0;
        }

        .signature-name {
            font-weight: 700;
            color: #5a3e6e;
            font-size: 1em;
            margin-bottom: 5px;
        }

        .signature-title {
            font-size: 0.85em;
            color: #9d8baf;
            font-style: italic;
        }

        .certificate-seal {
            position: absolute;
            bottom: 40px;
            right: 60px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd6e8, #e0c3fc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            border: 5px solid #c4b5fd;
            box-shadow: 0 5px 20px rgba(196, 181, 253, 0.4);
        }

        .certificate-id {
            text-align: center;
            margin-top: 30px;
            font-size: 0.85em;
            color: #9d8baf;
        }

        /* Modal customization */
        .modal-xl {
            max-width: 95%;
        }

        .modal-content {
            border-radius: 20px;
            border: none;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            .certificate-display, .certificate-display * {
                visibility: visible;
            }
            .certificate-display {
                position: absolute;
                left: 0;
                top: 0;
            }
        }

        @media (max-width: 768px) {
            .certificates-grid {
                grid-template-columns: 1fr;
            }
            .certificate-display {
                padding: 30px;
            }
            .certificate-title {
                font-size: 2em;
            }
            .recipient-name {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container-custom">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </button>

        <div class="page-header">
            <h1><i class="bi bi-award-fill"></i> My Certificates</h1>
            <p>View and download your earned certificates</p>
        </div>

        <div class="certificates-grid" id="certificatesGrid">
            <!-- Certificates will be populated here -->
        </div>
    </div>

    <!-- Certificate Modal -->
    <div class="modal fade" id="certificateModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(135deg, #ffd6e8, #e0c3fc); color: #5a3e6e;">
                    <h5 class="modal-title" style="font-weight: 700;">
                        <i class="bi bi-award"></i> Certificate of Achievement
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="background: #f8f9fa;">
                    <div id="certificateContent"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn" style="background: linear-gradient(135deg, #ffd6e8, #fecfef); color: #5a3e6e; font-weight: 700;" onclick="downloadCertificate()">
                        <i class="bi bi-download"></i> Download
                    </button>
                    <button type="button" class="btn" style="background: linear-gradient(135deg, #c4b5fd, #e0c3fc); color: white; font-weight: 700;" onclick="window.print()">
                        <i class="bi bi-printer"></i> Print
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

    <script>
        // Certificate data
        const certificates = [
            {
                id: 'CERT-2024-001',
                event: 'Beach Cleanup Drive',
                date: 'November 15, 2024',
                hours: 4,
                location: 'Baga Beach',
                type: 'Volunteer',
                icon: '🏖️',
                description: 'For outstanding contribution to environmental conservation'
            },
            {
                id: 'CERT-2024-002',
                event: 'Food Distribution Program',
                date: 'October 22, 2024',
                hours: 6,
                location: 'Community Center',
                type: 'Community Service',
                icon: '🍲',
                description: 'For dedicated service in helping families in need'
            },
            {
                id: 'CERT-2024-003',
                event: 'Teaching Assistant Program',
                date: 'September 10, 2024',
                hours: 8,
                location: 'Local School',
                type: 'Education',
                icon: '📚',
                description: 'For inspiring young minds through education'
            },
            {
                id: 'CERT-2024-004',
                event: 'Tree Plantation Campaign',
                date: 'August 5, 2024',
                hours: 5,
                location: 'City Park',
                type: 'Environmental',
                icon: '🌳',
                description: 'For commitment to environmental sustainability'
            },
            {
                id: 'CERT-2024-005',
                event: 'Senior Care Initiative',
                date: 'July 18, 2024',
                hours: 7,
                location: 'Care Home',
                type: 'Community Service',
                icon: '❤️',
                description: 'For compassionate care and dedication to seniors'
            },
            {
                id: 'CERT-2024-006',
                event: 'Animal Shelter Support',
                date: 'June 30, 2024',
                hours: 4,
                location: 'City Animal Shelter',
                type: 'Animal Welfare',
                icon: '🐾',
                description: 'For loving care and support of rescue animals'
            },
            {
                id: 'CERT-2024-007',
                event: 'Blood Donation Camp',
                date: 'May 12, 2024',
                hours: 3,
                location: 'Medical Center',
                type: 'Healthcare',
                icon: '🩸',
                description: 'For life-saving contribution to the community'
            },
            {
                id: 'CERT-2024-008',
                event: 'Youth Sports Mentoring',
                date: 'April 8, 2024',
                hours: 10,
                location: 'Sports Complex',
                type: 'Youth Development',
                icon: '⚽',
                description: 'For mentoring and inspiring young athletes'
            }
        ];

        const userName = localStorage.getItem('userEmail')?.split('@')[0] || 'Volunteer';

        // Populate certificates grid
        function populateCertificates() {
            const grid = document.getElementById('certificatesGrid');
            grid.innerHTML = certificates.map(cert => `
                <div class="certificate-card" onclick="viewCertificate('${cert.id}')">
                    <div class="certificate-preview">
                        <span>${cert.icon}</span>
                    </div>
                    <div class="certificate-info">
                        <h3>${cert.event}</h3>
                        <div class="certificate-meta">
                            <span class="meta-badge">
                                <i class="bi bi-calendar"></i> ${cert.date}
                            </span>
                            <span class="meta-badge">
                                <i class="bi bi-clock"></i> ${cert.hours} hours
                            </span>
                            <span class="meta-badge">
                                <i class="bi bi-geo-alt"></i> ${cert.location}
                            </span>
                        </div>
                        <div class="certificate-actions">
                            <button class="btn-view" onclick="event.stopPropagation(); viewCertificate('${cert.id}')">
                                <i class="bi bi-eye"></i> View
                            </button>
                            <button class="btn-download" onclick="event.stopPropagation(); quickDownload('${cert.id}')">
                                <i class="bi bi-download"></i> Download
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function viewCertificate(certId) {
            const cert = certificates.find(c => c.id === certId);
            if (!cert) return;

            const content = document.getElementById('certificateContent');
            content.innerHTML = `
                <div class="certificate-display" id="printableCertificate">
                    <div class="certificate-ornament top-left">❀</div>
                    <div class="certificate-ornament top-right">❀</div>
                    <div class="certificate-ornament bottom-left">❀</div>
                    <div class="certificate-ornament bottom-right">❀</div>

                    <div class="certificate-header">
                        <div class="certificate-logo">${cert.icon}</div>
                        <div class="certificate-title">Certificate of Achievement</div>
                        <div class="certificate-subtitle">Community Service Portal</div>
                    </div>

                    <div class="certificate-body">
                        <p class="certificate-text">This is to certify that</p>
                        <div class="recipient-name">${userName}</div>
                        <p class="certificate-text">${cert.description}</p>
                        <p class="certificate-text">at the</p>
                        <h3 style="color: #5a3e6e; margin: 20px 0; font-size: 1.8em;">${cert.event}</h3>

                        <div class="certificate-details">
                            <div class="detail-item">
                                <div class="detail-label">Date</div>
                                <div class="detail-value">${cert.date}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Location</div>
                                <div class="detail-value">${cert.location}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Hours</div>
                                <div class="detail-value">${cert.hours} hours</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Category</div>
                                <div class="detail-value">${cert.type}</div>
                            </div>
                        </div>

                        <div class="signature-section">
                            <div class="signature-block">
                                <div class="signature-image">Priya Sharma</div>
                                <div class="signature-line"></div>
                                <div class="signature-name">Dr. Priya Sharma</div>
                                <div class="signature-title">Program Director</div>
                            </div>
                            <div class="signature-block">
                                <div class="signature-image">Rahul Mehta</div>
                                <div class="signature-line"></div>
                                <div class="signature-name">Rahul Mehta</div>
                                <div class="signature-title">Community Coordinator</div>
                            </div>
                            <div class="signature-block">
                                <div class="signature-image">Anjali Desai</div>
                                <div class="signature-line"></div>
                                <div class="signature-name">Anjali Desai</div>
                                <div class="signature-title">Volunteer Manager</div>
                            </div>
                        </div>

                        <div class="certificate-seal">
                            <i class="bi bi-award-fill"></i>
                        </div>

                        <div class="certificate-id">
                            Certificate ID: ${cert.id} | Issued: ${new Date().toLocaleDateString()}
                        </div>
                    </div>
                </div>
            `;

            new bootstrap.Modal(document.getElementById('certificateModal')).show();
        }

        function downloadCertificate() {
            alert('Certificate download initiated! In a production environment, this would generate a PDF.');
        }

        function quickDownload(certId) {
            alert(`Downloading certificate ${certId}...`);
        }

        // Initialize
        populateCertificates();
    </script>
</body>
</html>
